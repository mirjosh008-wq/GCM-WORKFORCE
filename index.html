<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#164e3e"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>GCM Workforce</title></head><body><header><h1>GCM Workforce</h1><small>CV Globalindo Cakra Mandiri · Laporan Kunjungan</small></header><main><section class="panel"><div id="network"></div><p class="hint">Demo offline-first. WO disimpan di perangkat. Masuk Google diperlukan untuk sinkronisasi online.</p><label>Work Order <select id="wo"></select></label><button id="refresh" class="secondary">Unduh WO dari server</button><label>Nama teknisi <input id="technician" placeholder="Nama teknisi"></label><label>Waktu tiba <input id="arrived" type="datetime-local"></label><button id="gps" class="secondary">Ambil GPS saat tiba</button><small id="gpsText">GPS belum direkam</small><label>Problem <textarea id="problem" rows="3"></textarea></label><label>Diagnosis <textarea id="diagnosis" rows="2"></textarea></label><label>Solusi / tindakan <textarea id="solution" rows="3"></textarea></label><label>Hasil / tindak lanjut <textarea id="result" rows="2"></textarea></label><label>Status kunjungan <select id="status"><option value="pending">Pending</option><option value="waiting_parts">Menunggu spare part</option><option value="completed">Pekerjaan selesai</option></select></label><h3>Spare part</h3><label>Nama <input id="partName" placeholder="Bearing"></label><label>Part number / tipe <input id="partType" placeholder="6306 2RS"></label><label>Jumlah <input id="partQty" type="number" min="1" value="1"></label><button id="addPart" class="secondary">Tambah spare part</button><ul id="parts"></ul><h3>Dokumentasi</h3><label>Foto pekerjaan <input id="photos" type="file" accept="image/*" multiple></label><ul id="photoList"></ul><div class="actions"><button id="save">Simpan draft offline</button><button id="send" class="secondary">Kirim ke Master Admin</button></div><p id="message" role="status"></p></section><section class="panel"><h2>Draft dan antrean</h2><ul id="drafts"></ul><button id="sync" class="secondary">Coba kirim antrean</button></section></main><script src="config.js"></script><script src="app.js" type="module"></script></body></html>
